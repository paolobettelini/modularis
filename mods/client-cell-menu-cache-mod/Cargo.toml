cell-menu-api = { git = "https://github.com/paolobettelini/modularis.git" }
cell-menu-events-mod = { path = "../cell-menu-events-mod" }
client-cell-menu-cache-api = { path = "../client-cell-menu-cache-api" }
tokio = { version = "1.48.0", features = ["full"] }
