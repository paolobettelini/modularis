[package]
name = "client-cell-menu-cache-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientCellMenuCacheMod"
provides = "client-cell-menu-cache-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "cell-menu-events-mod"]
