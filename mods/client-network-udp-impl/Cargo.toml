[package]
name = "client-network-udp-impl"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ClientUdpNetwork"
provides = "client-network-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-config-api",
    "client-game-state-api",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
client-config-api = { path = "../client-config-api" }
client-game-state-api = { path = "../client-game-state-api" }
client-network-api = { path = "../client-network-api" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
