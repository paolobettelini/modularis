[package]
name = "server-biome-aether-tempest-isles-vanilla-mod"
version = "0.1.2"
edition = "2024"

[package.metadata.mod]
entry = "ServerBiomeAetherTempestIslesVanillaMod"

[package.metadata.mod.dependencies]
