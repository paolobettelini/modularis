biome-aether-tempest-isles = { path = "../biome-aether-tempest-isles" }
generated-biome-registry = "0.1.0"
generated-block-registry = "0.1.0"
server-biome-api = { path = "../server-biome-api" }
server-biome-feature-aether-lights-vanilla-mod = { path = "../server-biome-feature-aether-lights-vanilla-mod" }
server-biome-feature-surface-patches-vanilla-mod = { path = "../server-biome-feature-surface-patches-vanilla-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-state = { path = "../generated-block-state" }
