[package]
name = "server-player-movement-collision-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerMovementCollisionVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-manager-api",
    "server-chunk-world-api",
    "server-player-registry-api",
    "server-player-speed-api",
    "server-player-flight-api",
    "server-player-flight-speed-api",
    "server-player-hitbox-api",
    "block-shape-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-shape-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-block-registry = "0.1.0"
player-block-collision-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-hitbox-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-world-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-registry-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-speed-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-flight-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-flight-speed-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-hitbox-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-movement-collision-lib = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
