[package]
name = "server-portal-ignite-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPortalIgniteVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "inventory-events-mod",
    "server-portal-api",
    "server-chunk-world-api",
    "server-dimension-api",
    "block-manager-api",
    "item-portal-igniter-meta",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-manager-api = { path = "../block-manager-api" }
inventory-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
inventory-events-mod = { path = "../inventory-events-mod" }
item-portal-igniter-meta = { path = "../item-portal-igniter-meta" }
item-use-api = { git = "https://github.com/paolobettelini/modularis.git" }
portal-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-dimension-api = { path = "../server-dimension-api" }
server-portal-api = { path = "../server-portal-api" }
server-portal-ignite-lib = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
