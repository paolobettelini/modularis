[package]
name = "client-looked-block-outline-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientLookedBlockOutlineVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-manager-api",
    "client-block-interaction-rules-api",
    "client-block-outline-api",
    "client-camera-api",
    "client-chunk-cache-api",
    "client-game-state-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-manager-api = { path = "../block-manager-api" }
client-block-interaction-rules-api = { path = "../client-block-interaction-rules-api" }
client-block-outline-api = { path = "../client-block-outline-api" }
client-camera-api = { path = "../client-camera-api" }
client-chunk-cache-api = { path = "../client-chunk-cache-api" }
client-game-state-api = { path = "../client-game-state-api" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { path = "../voxel-math-api" }
voxel-raycast-api = { path = "../voxel-raycast-api" }
