[package]
name = "server-nether-portal-rule-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerNetherPortalRuleVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-portal-api",
    "dimension-overworld",
    "dimension-nether",
]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
dimension-nether = { path = "../dimension-nether" }
dimension-overworld = { path = "../dimension-overworld" }
generated-block-registry = "0.1.0"
generated-dimension-registry = "0.1.0"
server-portal-api = { path = "../server-portal-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
