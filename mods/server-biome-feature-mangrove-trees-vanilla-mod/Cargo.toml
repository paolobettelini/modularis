[package]
name = "server-biome-feature-mangrove-trees-vanilla-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerBiomeFeatureMangroveTreesVanillaMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-biome-api", "block-mangrove-log", "block-mangrove-leaves", "block-mangrove-roots", "block-muddy-mangrove-roots"]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
block-muddy-mangrove-roots = { path = "../block-muddy-mangrove-roots" }
block-mangrove-roots = { path = "../block-mangrove-roots" }
block-mangrove-leaves = { path = "../block-mangrove-leaves" }
block-mangrove-log = { path = "../block-mangrove-log" }
generated-block-registry = "0.1.0"
server-biome-api = { path = "../server-biome-api" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
