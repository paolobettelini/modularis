[package]
name = "client-cell-menu-ui-bevy-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientCellMenuUiBevyMod"
provides = "client-cell-menu-ui-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "cell-menu-events-mod",
    "client-cell-menu-cache-api",
    "client-game-state-api",
    "inventory-events-mod",
    "item-manager-api",
]
