[package]
name = "patchwork-game-auth-crypto-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
uuid = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
