[package]
name = "server-chat-global-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerChatGlobalVanillaMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-chat-api", "server-player-registry-api"]
