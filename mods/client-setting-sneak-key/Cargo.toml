[package]
name = "client-setting-sneak-key"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingSneakKeyMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "controls.sneak_key"
label = "Sneak key"
type = "string"
input = "keybinding"
default = "ShiftLeft"

[dependencies]
settings-schema-api = { path = "../settings-schema-api" }
tokio = { version = "1.48.0", features = ["full"] }
