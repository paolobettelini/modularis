[package]
name = "server-command-teleport-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerCommandTeleportVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-command-api",
    "server-chat-api",
    "server-player-registry-api",
    "server-dimension-api",
]
run = []
ownership = []

[dependencies]
audience-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
generated-dimension-registry = "0.1.0"
player-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
server-chat-api = { path = "../server-chat-api" }
server-command-api = { path = "../server-command-api" }
server-dimension-api = { path = "../server-dimension-api" }
server-player-registry-api = { path = "../server-player-registry-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-dimension-registry = { path = "../generated-dimension-registry" }
