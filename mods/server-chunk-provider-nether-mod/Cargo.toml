[package]
name = "server-chunk-provider-nether-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerChunkProviderNetherMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-chunk-provider-registry-mod", "block-manager-api"]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
block-manager-api = { path = "../block-manager-api" }
chunk-api = { path = "../chunk-api" }
coherent-noise-api = { path = "../coherent-noise-api" }
generated-block-registry = "0.1.0"
server-chunk-provider-api = { path = "../server-chunk-provider-api" }
server-chunk-provider-registry-mod = { path = "../server-chunk-provider-registry-mod" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { path = "../voxel-math-api" }

[patch.crates-io]
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
