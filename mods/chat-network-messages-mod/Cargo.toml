[package]
name = "chat-network-messages-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ChatNetworkMessagesMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.network.messages]
clientbound = [
    "chat_network_message_types::ChatMessage",
    "chat_network_message_types::CommandSuggestionsResponse",
]
serverbound = [
    "chat_network_message_types::ChatSubmit",
    "chat_network_message_types::CommandSuggestionsRequest",
]

[dependencies]
chat-network-message-types = { path = "../chat-network-message-types" }
tokio = { version = "1.48.0", features = ["full"] }
