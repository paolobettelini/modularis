[package]
name = "server-player-flight-speed-state-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerFlightSpeedStateMod"
provides = "server-player-flight-speed-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-player-lifecycle-events-mod"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
server-player-flight-speed-api = { path = "../server-player-flight-speed-api" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { path = "../server-player-lifecycle-events-mod" }
tokio = { version = "1.48.0", features = ["full"] }
