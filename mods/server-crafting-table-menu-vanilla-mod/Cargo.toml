[package]
name = "server-crafting-table-menu-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerCraftingTableMenuVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "cell-menu-events-mod",
    "server-chunk-world-api",
]
