[package]
name = "server-crafting-table-menu-vanilla-mod"
version = "0.1.2"
edition = "2024"

[package.metadata.mod]
entry = "ServerCraftingTableMenuVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "cell-menu-events-mod",
    "server-chunk-world-api",
    "server-player-permission-api",
    "server-player-registry-api",
    "server-player-gravity-api",
    "server-player-hitbox-api",
    "server-block-interaction-rules-api",
]
run = []
ownership = []

[dependencies]
server-player-registry-api = { path = "../server-player-registry-api" }
server-player-gravity-api = { path = "../server-player-gravity-api" }
server-player-hitbox-api = { path = "../server-player-hitbox-api" }
server-block-interaction-rules-api = { path = "../server-block-interaction-rules-api" }
audience-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
generated-permission-registry = "0.1.0"
cell-menu-api = { git = "https://github.com/paolobettelini/modularis.git" }
cell-menu-events-mod = { path = "../cell-menu-events-mod" }
generated-block-registry = "0.1.0"
inventory-core-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-crafting-table-menu-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-permission-api = { path = "../server-player-permission-api" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
generated-permission-registry = { path = "../generated-permission-registry" }
