[package]
name = "server-player-dimension-lifecycle-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerDimensionLifecycleVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-dimension-api",
    "server-player-registry-api",
    "server-player-lifecycle-events-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
server-dimension-api = { path = "../server-dimension-api" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { path = "../server-player-lifecycle-events-mod" }
server-player-registry-api = { path = "../server-player-registry-api" }
server-player-dimension-lifecycle-lib = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
