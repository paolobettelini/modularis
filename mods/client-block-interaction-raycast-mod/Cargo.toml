[package]
name = "client-block-interaction-raycast-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientBlockInteractionRaycastMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-edit-events-mod",
    "client-block-interaction-events-mod",
    "block-manager-api",
    "client-input-api",
    "client-camera-api",
    "client-chunk-cache-api",
    "block-shape-api",
    "client-game-state-api",
    "client-block-interaction-rules-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-shape-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-interaction-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-interaction-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-interaction-rules-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-camera-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-cache-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-input-api = { git = "https://github.com/paolobettelini/modularis.git" }
item-use-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-raycast-api = { git = "https://github.com/paolobettelini/modularis.git" }
