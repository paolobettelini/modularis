[package]
name = "server-world-seed-catalog-fs-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerWorldSeedCatalogFsImpl"
provides = "server-world-seed-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-world-catalog-api"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
server-world-catalog-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-world-seed-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }
