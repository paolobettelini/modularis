[package]
name = "server-player-gravity-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerGravityVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-manager-api",
    "server-chunk-world-api",
    "server-network-api",
    "server-player-registry-api",
    "server-player-lifecycle-events-mod",
    "server-player-gravity-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-manager-api = { path = "../block-manager-api" }
generated-block-registry = "0.1.0"
generated-network-messages = "0.1.0"
player-block-collision-api = { path = "../player-block-collision-api" }
server-player-gravity-api = { path = "../server-player-gravity-api" }
player-hitbox-api = { path = "../player-hitbox-api" }
player-network-message-types = { path = "../player-network-message-types" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-network-api = { path = "../server-network-api" }
server-player-lifecycle-events-api = { path = "../server-player-lifecycle-events-api" }
server-player-lifecycle-events-mod = { path = "../server-player-lifecycle-events-mod" }
server-player-registry-api = { path = "../server-player-registry-api" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { path = "../voxel-math-api" }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
generated-network-messages = { path = "../generated-network-messages" }
