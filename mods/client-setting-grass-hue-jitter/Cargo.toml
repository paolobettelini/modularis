[package]
name = "client-setting-grass-hue-jitter"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingGrassHueJitterMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "grass.hue_jitter_degrees"
label = "Blade hue jitter (degrees)"
type = "f32"
input = "f32"
default = 8.0
min = 0.0
max = 30.0
section = "graphics/grass"
section_label = "Grass"

[dependencies]
settings-schema-api = { path = "../settings-schema-api" }
tokio = { version = "1.48.0", features = ["full"] }
