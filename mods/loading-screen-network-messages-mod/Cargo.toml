[package]
name = "loading-screen-network-messages-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "LoadingScreenNetworkMessagesMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.network.messages]
clientbound = [
    "loading_screen_network_message_types::SetLoadingTask",
    "loading_screen_network_message_types::RemoveLoadingTask",
]

[dependencies]
loading-screen-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
