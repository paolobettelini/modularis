[package]
name = "client-game-bootstrap-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "DemoGameBootstrapMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-bevy-default-plugins-mod",
    "client-game-state-api",
    "client-menu-api",
    "client-settings-api",
    "client-chunk-render-api",
    "client-player-controller-api",
    "client-camera-api",
    "client-network-api",
    "client-session-api",
    "client-player-render-api",
    "client-chunk-request-network-mod",
    "client-player-network-sync-mod",
    "client-block-interaction-raycast-mod",
    "client-block-edit-network-send-mod",
    "client-block-edit-network-receive-mod",
]
run = []
ownership = ["bevy-mod"]

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-manager-api = { path = "../block-manager-api" }
client-bevy-default-plugins-mod = { path = "../client-bevy-default-plugins-mod" }
client-block-edit-network-receive-mod = { path = "../client-block-edit-network-receive-mod" }
client-block-edit-network-send-mod = { path = "../client-block-edit-network-send-mod" }
client-block-interaction-raycast-mod = { path = "../client-block-interaction-raycast-mod" }
client-camera-api = { path = "../client-camera-api" }
client-chunk-request-network-mod = { path = "../client-chunk-request-network-mod" }
client-chunk-render-api = { path = "../client-chunk-render-api" }
client-game-state-api = { path = "../client-game-state-api" }
client-menu-api = { path = "../client-menu-api" }
client-network-api = { path = "../client-network-api" }
client-player-network-sync-mod = { path = "../client-player-network-sync-mod" }
client-player-render-api = { path = "../client-player-render-api" }
client-player-controller-api = { path = "../client-player-controller-api" }
client-session-api = { path = "../client-session-api" }
client-settings-api = { path = "../client-settings-api" }
tokio = { version = "1.48.0", features = ["full"] }
