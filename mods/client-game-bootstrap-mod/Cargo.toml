[package]
name = "client-game-bootstrap-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "DemoGameBootstrapMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-bevy-default-plugins-mod",
    "client-game-state-api",
    "client-menu-api",
    "client-settings-api",
    "client-chunk-render-api",
    "client-player-controller-api",
    "client-camera-api",
    "client-network-api",
    "client-session-api",
    "client-player-render-api",
    "client-chunk-request-network-mod",
    "client-player-network-sync-mod",
    "client-block-interaction-raycast-mod",
    "client-block-edit-network-send-mod",
    "client-block-edit-network-receive-mod",
]
run = []
ownership = ["bevy-mod"]

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-bevy-default-plugins-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-edit-network-receive-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-edit-network-send-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-interaction-raycast-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-camera-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-request-network-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-render-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-menu-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-network-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-network-sync-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-render-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-controller-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-session-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-settings-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
