[package]
name = "server-player-flight-network-sync-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerFlightNetworkSyncMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-player-flight-api",
    "server-network-events-api",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
player-flight-network-message-types = { path = "../player-flight-network-message-types" }
server-network-events-api = { path = "../server-network-events-api" }
server-player-flight-api = { path = "../server-player-flight-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
