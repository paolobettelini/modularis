[package]
name = "client-player-jump-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientPlayerJumpVanillaMod"
provides = "player-jump-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-network-api",
    "client-session-api",
    "client-player-controller-api",
    "player-gravity-api",
    "network-protocol-mod",
    "client-game-state-api",
    "client-settings-api",
    "client-settings-registry-codegen",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-keybinding-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-network-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-controller-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-session-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-settings-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-settings-registry-codegen = { git = "https://github.com/paolobettelini/modularis.git" }
generated-client-settings-registry = "0.1.0"
generated-network-messages = "0.1.0"
network-protocol-mod = { git = "https://github.com/paolobettelini/modularis.git" }
player-gravity-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-jump-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-jump-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-client-settings-registry = { path = "../generated-client-settings-registry" }
generated-network-messages = { path = "../generated-network-messages" }
