[package]
name = "client-grass-tint-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientGrassTintVanillaMod"
provides = "client-grass-tint-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-grass",
    "block-moss",
    "block-netherrack",
    "block-crimson-nylium",
    "block-warped-nylium",
    "block-soul-sand",
    "block-basalt",
    "block-calcite",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-basalt = { git = "https://github.com/paolobettelini/modularis.git" }
block-calcite = { git = "https://github.com/paolobettelini/modularis.git" }
block-crimson-nylium = { git = "https://github.com/paolobettelini/modularis.git" }
block-grass = { git = "https://github.com/paolobettelini/modularis.git" }
block-moss = { git = "https://github.com/paolobettelini/modularis.git" }
block-netherrack = { git = "https://github.com/paolobettelini/modularis.git" }
block-soul-sand = { git = "https://github.com/paolobettelini/modularis.git" }
block-warped-nylium = { git = "https://github.com/paolobettelini/modularis.git" }
client-dimension-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-grass-tint-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-block-registry = "0.1.0"
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
