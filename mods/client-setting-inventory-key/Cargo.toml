[package]
name = "client-setting-inventory-key"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingInventoryKeyMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "controls.inventory_key"
label = "Inventory key"
type = "string"
input = "keybinding"
default = "E"
section = "controls/keybinds"
section_label = "Keybinds"

[dependencies]
settings-schema-api = { path = "../settings-schema-api" }
tokio = { version = "1.48.0", features = ["full"] }
