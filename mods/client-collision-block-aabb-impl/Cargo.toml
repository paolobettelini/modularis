[package]
name = "client-collision-block-aabb-impl"
version = "0.1.2"
edition = "2024"

[package.metadata.mod]
entry = "BlockAabbCollisionImpl"
provides = "collision-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-chunk-cache-api",
    "block-manager-api",
    "block-shape-api",
]
run = []
ownership = []

[dependencies]
character-collision-lib = {git = "https://github.com/paolobettelini/modularis.git"}
voxel-frame-collision-lib = {git = "https://github.com/paolobettelini/modularis.git"}
client-voxel-frame-api = {git = "https://github.com/paolobettelini/modularis.git"}
voxel-frame-registry-api = {git = "https://github.com/paolobettelini/modularis.git"}
voxel-frame-api = {git = "https://github.com/paolobettelini/modularis.git"}
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { path = "../block-manager-api" }
block-shape-api = { path = "../block-shape-api" }
client-chunk-cache-api = { path = "../client-chunk-cache-api" }
collision-api = { path = "../collision-api" }
generated-block-registry = "0.1.0"
player-block-collision-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-state = { path = "../generated-block-state" }
generated-block-registry = { path = "../generated-block-registry" }
