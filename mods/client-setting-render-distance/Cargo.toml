[package]
name = "client-setting-render-distance"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "SettingRenderDistanceMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "graphics.render_distance"
label = "Render distance (chunks)"
type = "i32"
input = "i32"
default = 8

[dependencies]
settings-schema-api = { path = "../settings-schema-api" }
tokio = { version = "1.48.0", features = ["full"] }
