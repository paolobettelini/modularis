[package]
name = "server-creative-inventory-network-receive-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerCreativeInventoryNetworkReceiveMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "creative-inventory-events-mod", "server-player-registry-api", "network-protocol-mod"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
creative-inventory-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
creative-inventory-events-mod = { path = "../creative-inventory-events-mod" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
server-player-registry-api = { path = "../server-player-registry-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
