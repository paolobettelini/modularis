[package]
name = "session-network-messages-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "SessionNetworkMessagesMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.network.messages]
clientbound = [
    "session_network_message_types::JoinAccepted",
    "session_network_message_types::JoinRejected",
]
serverbound = [
    "session_network_message_types::JoinRequest",
    "session_network_message_types::LeaveRequest",
]

[dependencies]
session-network-message-types = { path = "../session-network-message-types" }
tokio = { version = "1.48.0", features = ["full"] }
