[package]
name = "client-portal-render-bevy-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientPortalRenderBevyMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-bevy-default-plugins-mod",
    "client-dimension-api",
    "client-chunk-streaming-api",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-bevy-default-plugins-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-streaming-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-dimension-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
network-protocol-mod = { git = "https://github.com/paolobettelini/modularis.git" }
portal-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
