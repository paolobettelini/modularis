[package]
name = "thecrown-game-main-mod"
version = "0.1.4"
edition = "2024"

[package.metadata.mod]
entry = "TheCrownGameMainMod"
[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "thecrown-game-relay-api",
    "thecrown-game-session-api",
    "thecrown-world-template-api",
    "server-scope-api",
    "server-scope-world-api",
    "server-chunk-world-api",
    "server-player-registry-api",
    "server-kick-api",
    "server-player-world-api",
    "server-player-gravity-api",
    "server-player-flight-api",
    "server-player-scale-api",
    "server-chat-api",
    "server-command-api",
    "server-sound-api",
    "server-external-link-api",
    "block-edit-events-mod",
    "voxel-frame-kinematic-api",
]
run = []
ownership = []

[dependencies]
audience-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-edit-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-mod = { path = "../block-edit-events-mod" }
block-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
chunk-api = { git = "https://github.com/paolobettelini/modularis.git" }
chunk-storage-binary-format-lib = { git = "https://github.com/paolobettelini/modularis.git" }
generated-block-registry = "0.1.0"
generated-sound-registry = "0.1.0"
parkour-gameplay-lib = { git = "https://github.com/paolobettelini/modularis.git" }
patchwork-game-auth-api = { path = "../patchwork-game-auth-api" }
player-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
server-chat-api = { path = "../server-chat-api" }
server-chunk-provider-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-routing-api = { path = "../server-chunk-routing-api" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-command-api = { path = "../server-command-api" }
server-external-link-api = { path = "../server-external-link-api" }
server-kick-api = { path = "../server-kick-api" }
server-player-chat-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-gravity-api = { path = "../server-player-gravity-api" }
server-player-flight-api = { path = "../server-player-flight-api" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-registry-api = { path = "../server-player-registry-api" }
server-player-scale-api = { path = "../server-player-scale-api" }
server-player-surface-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-world-api = { path = "../server-player-world-api" }
server-scope-api = { path = "../server-scope-api" }
server-scope-world-api = { path = "../server-scope-world-api" }
server-sound-api = { path = "../server-sound-api" }
thecrown-game-config-api = { path = "../thecrown-game-config-api" }
thecrown-game-relay-api = { path = "../thecrown-game-relay-api" }
thecrown-game-session-api = { path = "../thecrown-game-session-api" }
thecrown-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
thecrown-protocol = { git = "https://github.com/paolobettelini/modularis.git" }
thecrown-world-template-api = { path = "../thecrown-world-template-api" }
tokio = { version = "1.48.0", features = ["full"] }
uuid = "1.24.0"
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-frame-api = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-frame-kinematic-api = { path = "../voxel-frame-kinematic-api" }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
generated-block-state = { path = "../generated-block-state" }
generated-permission-registry = { path = "../generated-permission-registry" }
generated-sound-registry = { path = "../generated-sound-registry" }
