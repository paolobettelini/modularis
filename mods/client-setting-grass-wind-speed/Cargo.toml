[package]
name = "client-setting-grass-wind-speed"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingGrassWindSpeedMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "grass.wind_speed"
label = "Wind speed"
type = "f32"
input = "f32"
default = 1.0
min = 0.0
max = 5.0
section = "graphics/grass"
section_label = "Grass"

[dependencies]
settings-schema-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
