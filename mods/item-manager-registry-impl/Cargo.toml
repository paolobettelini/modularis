[package]
name = "item-manager-registry-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "RegistryItemManager"
provides = "item-manager-api"

[package.metadata.mod.dependencies]
init = ["item-registry-codegen"]
run = []
ownership = []

[dependencies]
generated-item-registry = "0.1.0"
item-api = { git = "https://github.com/paolobettelini/modularis.git" }
item-manager-api = { path = "../item-manager-api" }
item-render-api = { git = "https://github.com/paolobettelini/modularis.git" }
item-registry-codegen = { path = "../item-registry-codegen" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-item-registry = { path = "../generated-item-registry" }
