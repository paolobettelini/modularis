[package]
name = "client-player-hitbox-scale-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientPlayerHitboxScaleVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "player-hitbox-api",
    "player-scale-api",
    "client-player-scale-map-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-scale-map-api = { git = "https://github.com/paolobettelini/modularis.git" }
