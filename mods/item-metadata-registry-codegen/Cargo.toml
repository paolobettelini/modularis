[package]
name = "item-metadata-registry-codegen"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ItemMetadataRegistryCodegenMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[[package.metadata.mod.codegen]]
crate = "generated-item-metadata"
version = "0.1.0"
dev_crate = "generated-item-metadata"

[package.metadata.mod.codegen.generator]
crate = "item-metadata-registry-codegen"
command = "generate"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9"

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
