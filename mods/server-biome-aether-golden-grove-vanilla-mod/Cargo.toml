[package]
name = "server-biome-aether-golden-grove-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerBiomeAetherGoldenGroveVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-biome-api",
    "biome-aether-golden-grove",
    "server-biome-feature-oak-trees-vanilla-mod",
    "server-biome-feature-glowstone-clusters-vanilla-mod",
    "server-biome-feature-short-grass-vanilla-mod",
]
run = []
ownership = []

[dependencies]
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
biome-aether-golden-grove = { git = "https://github.com/paolobettelini/modularis.git" }
generated-biome-registry = "0.1.0"
generated-block-registry = "0.1.0"
server-biome-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-biome-feature-oak-trees-vanilla-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-biome-feature-glowstone-clusters-vanilla-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-biome-feature-short-grass-vanilla-mod = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
