[package]
name = "server-player-outline-network-sync-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerOutlineNetworkSyncMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-player-outline-api", "server-network-events-api", "server-player-lifecycle-events-mod", "network-protocol-mod"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
outline-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
server-network-events-api = { path = "../server-network-events-api" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { path = "../server-player-lifecycle-events-mod" }
server-player-outline-api = { path = "../server-player-outline-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
