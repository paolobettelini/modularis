[package]
name = "thecrown-database"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
default = ["sqlite"]
sqlite = ["diesel/sqlite"]
mysql = ["diesel/mysql"]

[dependencies]
chrono = { version = "0.4.44", features = ["serde"] }
diesel = { version = "2.3.12", default-features = false, features = ["32-column-tables", "chrono", "r2d2"] }
diesel_migrations = "2.3.2"
hex = "0.4"
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.24.0", features = ["serde"] }
