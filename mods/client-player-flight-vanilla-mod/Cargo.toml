[package]
name = "client-player-flight-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientPlayerFlightVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "player-flight-api",
    "player-flight-speed-api",
    "client-player-controller-api",
    "player-gravity-api",
    "client-settings-api",
    "client-settings-registry-codegen",
    "client-game-state-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-keybinding-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-controller-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-settings-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-settings-registry-codegen = { git = "https://github.com/paolobettelini/modularis.git" }
generated-client-settings-registry = "0.1.0"
player-flight-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-flight-speed-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-gravity-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-client-settings-registry = { path = "../generated-client-settings-registry" }
