[package]
name = "server-chunk-storage-fs-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerChunkStorageFsImpl"
provides = "server-chunk-storage-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-world-catalog-api"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }
chunk-api = { git = "https://github.com/paolobettelini/modularis.git" }
chunk-storage-binary-format-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-storage-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-world-catalog-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
