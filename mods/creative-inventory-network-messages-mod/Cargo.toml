[package]
name = "creative-inventory-network-messages-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "CreativeInventoryNetworkMessagesMod"

[package.metadata.mod.dependencies]
init = ["item-registry-codegen"]
run = []
ownership = []

[package.metadata.network.messages]
serverbound = ["creative_inventory_network_message_types::CreativeItemTakeRequest"]

[dependencies]
creative-inventory-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
item-registry-codegen = { path = "../item-registry-codegen" }
tokio = { version = "1.48.0", features = ["full"] }
