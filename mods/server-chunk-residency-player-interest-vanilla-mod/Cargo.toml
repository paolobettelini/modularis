[package]
name = "server-chunk-residency-player-interest-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerChunkResidencyPlayerInterestVanillaMod"
provides = "server-chunk-residency-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-chunk-world-api", "server-player-registry-api"]
run = []
ownership = []

[dependencies]
