bevy-mod = { path = "../bevy-mod" }
server-chunk-residency-api = { path = "../server-chunk-residency-api" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-player-registry-api = { path = "../server-player-registry-api" }
server-chunk-residency-player-interest-lib = { path = "../server-chunk-residency-player-interest-lib" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { path = "../voxel-math-api" }
