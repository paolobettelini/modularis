client-cell-menu-cache-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-inventory-cache-api = { git = "https://github.com/paolobettelini/modularis.git" }
inventory-core-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
