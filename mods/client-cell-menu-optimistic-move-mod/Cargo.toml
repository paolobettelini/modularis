[package]
name = "client-cell-menu-optimistic-move-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientCellMenuOptimisticMoveMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "cell-menu-events-mod",
    "client-cell-menu-cache-api",
    "client-inventory-cache-api",
]
