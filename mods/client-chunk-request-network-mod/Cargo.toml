[package]
name = "client-chunk-request-network-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientChunkRequestNetworkMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-network-api",
    "client-chunk-streaming-api",
    "client-chunk-cache-api",
    "client-chunk-work-priority-api",
    "client-game-state-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
chunk-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-cache-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-work-priority-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-streaming-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-network-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
