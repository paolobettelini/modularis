[package]
name = "chunk-network-messages-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ChunkNetworkMessagesMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.network.messages]
clientbound = ["chunk_network_message_types::ChunkResponse"]
