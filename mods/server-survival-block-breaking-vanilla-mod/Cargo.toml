[package]
name = "server-survival-block-breaking-vanilla-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerSurvivalBlockBreakingVanillaMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-edit-events-mod",
    "block-damage-events-mod",
    "block-properties-registry-mod",
    "block-damage-component-mod",
    "server-block-breaking-events-mod",
    "server-block-component-api",
    "server-chunk-world-api",
    "server-world-data-storage-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-component-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-damage-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-damage-events-mod = { path = "../block-damage-events-mod" }
block-damage-component-mod = { path = "../block-damage-component-mod" }
block-durability-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-mod = { path = "../block-edit-events-mod" }
block-properties-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-properties-registry-mod = { path = "../block-properties-registry-mod" }
server-block-breaking-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-block-breaking-events-mod = { path = "../server-block-breaking-events-mod" }
server-block-component-api = { path = "../server-block-component-api" }
server-block-component-persistence-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-block-durability-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-block-edit-world-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-survival-block-breaking-vanilla-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-world-data-storage-api = { path = "../server-world-data-storage-api" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
