[package]
name = "voxel-models-lib"
version = "0.1.0"
edition = "2024"
description = "Minecraft Java resource-pack model, blockstate and item-definition parser with voxel-friendly quad baking and optional Bevy integration"
readme = "README.md"

[features]
default = []
bevy = ["dep:bevy_asset", "dep:bevy_mesh"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bevy_asset = { version = "0.19", optional = true }
bevy_mesh = { version = "0.19", optional = true }

[dev-dependencies]
tempfile = "3"

[[example]]
name = "inspect"
path = "examples/inspect.rs"
