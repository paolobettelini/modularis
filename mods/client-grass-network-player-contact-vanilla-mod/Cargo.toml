[package]
name = "client-grass-network-player-contact-vanilla-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientGrassNetworkPlayerContactVanillaMod"

[package.metadata.mod.dependencies]
