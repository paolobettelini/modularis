[package]
name = "client-setting-grass-render-radius"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingGrassRenderRadiusMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "grass.render_radius"
label = "Render radius (blocks)"
type = "i32"
input = "i32"
default = 96
min = 16
max = 160
section = "graphics/grass"
section_label = "Grass"

[dependencies]
settings-schema-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
