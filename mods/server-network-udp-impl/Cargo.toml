[package]
name = "server-network-udp-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerUdpNetwork"
provides = "server-network-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-config-api",
    "network-protocol-mod",
    "server-bevy-runner-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
network-protocol-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-bevy-runner-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-config-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-network-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
