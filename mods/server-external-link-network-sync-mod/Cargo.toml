[package]
name = "server-external-link-network-sync-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerExternalLinkNetworkSyncMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-external-link-api",
    "server-audience-api",
    "server-player-registry-api",
    "server-network-events-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
external-link-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
server-audience-api = { path = "../server-audience-api" }
server-external-link-api = { path = "../server-external-link-api" }
server-network-events-api = { path = "../server-network-events-api" }
server-player-registry-api = { path = "../server-player-registry-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
