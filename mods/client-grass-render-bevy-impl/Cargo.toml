[package]
name = "client-grass-render-bevy-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientGrassRenderBevyImpl"
provides = "client-grass-render-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-bevy-default-plugins-mod",
    "client-chunk-cache-api",
    "client-chunk-streaming-api",
    "client-game-state-api",
    "client-dimension-api",
    "client-grass-mesh-api",
    "client-grass-interaction-api",
    "client-grass-settings-api",
    "client-wind-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-bevy-default-plugins-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-cache-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-streaming-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-dimension-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-grass-mesh-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-grass-interaction-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-grass-render-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-grass-settings-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-wind-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
