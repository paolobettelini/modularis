[package]
name = "client-game-state-bevy-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "GameStateBevyImpl"
provides = "client-game-state-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "client-bevy-default-plugins-mod"]
