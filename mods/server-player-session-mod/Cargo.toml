[package]
name = "server-player-session-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerPlayerSessionMod"
provides = "server-player-registry-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-network-api",
    "server-network-events-api",
    "network-protocol-mod",
    "server-player-lifecycle-events-mod",
    "server-player-visibility-api",
    "server-kick-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
network-protocol-mod = { git = "https://github.com/paolobettelini/modularis.git" }
player-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
session-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
server-network-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-network-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-kick-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-admission-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-registry-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-visibility-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
