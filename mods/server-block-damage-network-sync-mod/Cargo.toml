[package]
name = "server-block-damage-network-sync-mod"
version = "0.1.2"
edition = "2024"

[package.metadata.mod]
entry = "ServerBlockDamageNetworkSyncMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod", "block-damage-events-mod", "block-damage-network-messages-mod", "block-properties-registry-mod",
    "block-damage-component-mod", "server-block-component-api", "server-chunk-stream-events-mod",
    "server-chunk-world-api", "server-network-events-api", "server-player-registry-api",
    "server-world-data-storage-api", "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
voxel-frame-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-component-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-damage-component-mod = { path = "../block-damage-component-mod" }
block-damage-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-damage-events-mod = { path = "../block-damage-events-mod" }
block-damage-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
block-damage-network-messages-mod = { path = "../block-damage-network-messages-mod" }
block-durability-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-properties-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-properties-registry-mod = { path = "../block-properties-registry-mod" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
server-block-component-api = { path = "../server-block-component-api" }
server-block-component-persistence-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-block-breaking-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-block-durability-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-stream-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-stream-events-mod = { path = "../server-chunk-stream-events-mod" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-network-events-api = { path = "../server-network-events-api" }
server-player-registry-api = { path = "../server-player-registry-api" }
server-world-data-storage-api = { path = "../server-world-data-storage-api" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
