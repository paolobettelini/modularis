[package]
name = "server-network-router-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerNetworkRouterMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-network-api",
    "server-network-events-api",
    "server-player-registry-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
server-network-api = { path = "../server-network-api" }
server-network-events-api = { path = "../server-network-events-api" }
server-player-registry-api = { path = "../server-player-registry-api" }
tokio = { version = "1.48.0", features = ["full"] }
