[package]
name = "thecrown-game-session-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "TheCrownGameSessionMod"
provides = "thecrown-game-session-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "thecrown-game-config-api",
    "thecrown-game-relay-api",
    "server-player-registry-api",
    "server-network-events-api",
    "server-kick-api",
    "patchwork-game-auth-events-mod",
    "server-player-lifecycle-events-mod",
    "network-transport-events-mod",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
network-transport-events-mod = { path = "../network-transport-events-mod" }
patchwork-game-auth-api = { path = "../patchwork-game-auth-api" }
patchwork-game-auth-events-mod = { path = "../patchwork-game-auth-events-mod" }
player-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
server-kick-api = { path = "../server-kick-api" }
server-network-events-api = { path = "../server-network-events-api" }
server-player-admission-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { path = "../server-player-lifecycle-events-mod" }
server-player-registry-api = { path = "../server-player-registry-api" }
thecrown-game-config-api = { path = "../thecrown-game-config-api" }
thecrown-game-relay-api = { path = "../thecrown-game-relay-api" }
thecrown-game-session-api = { path = "../thecrown-game-session-api" }
thecrown-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
thecrown-protocol = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
uuid = "1.24.0"

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
