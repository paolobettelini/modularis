[package]
name = "server-inventory-default-loadout-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerInventoryDefaultLoadoutMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "inventory-events-mod",
    "server-inventory-layout-api",
    "item-manager-api",
    "block-manager-api",
    "item-metadata-registry-codegen",
    "server-player-lifecycle-events-mod",
    "server-inventory-api",
    "item-portal-igniter-meta",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-item-metadata = "0.1.0"
inventory-core-api = { git = "https://github.com/paolobettelini/modularis.git" }
inventory-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
inventory-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
item-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }
item-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
item-metadata-registry-codegen = { git = "https://github.com/paolobettelini/modularis.git" }
item-place-block-meta = { git = "https://github.com/paolobettelini/modularis.git" }
item-portal-igniter-meta = { git = "https://github.com/paolobettelini/modularis.git" }
item-quantity-meta = { git = "https://github.com/paolobettelini/modularis.git" }
server-inventory-layout-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-inventory-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-inventory-default-loadout-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-registry-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-item-metadata = { path = "../generated-item-metadata" }
