[package]
name = "client-bevy-default-plugins-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientBevyDefaultPluginsMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "client-config-api", "client-log-filter-api"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
client-config-api = { path = "../client-config-api" }
client-log-filter-api = { path = "../client-log-filter-api" }
tokio = { version = "1.48.0", features = ["full"] }
