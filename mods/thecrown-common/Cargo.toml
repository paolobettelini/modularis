[package]
name = "thecrown-common"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1.0"
async-nats = "0.50.0"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11.2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["serde", "v4"] }
