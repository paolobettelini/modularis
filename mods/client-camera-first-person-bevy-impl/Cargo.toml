client-input-api = { path = "../client-input-api" }
client-settings-api = { path = "../client-settings-api" }
player-gravity-api = { path = "../player-gravity-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-client-settings-registry = { path = "../generated-client-settings-registry" }
