[package]
name = "client-camera-first-person-bevy-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "FirstPersonCameraBevyImpl"
provides = "client-camera-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-input-api",
    "client-settings-api",
    "player-gravity-api",
    "client-game-state-api",
]
run = []
ownership = []

[dependencies]
