[package]
name = "client-chat-network-send-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientChatNetworkSendMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-chat-api",
    "client-network-api",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
chat-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
client-chat-api = { path = "../client-chat-api" }
client-network-api = { path = "../client-network-api" }
generated-network-messages = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
