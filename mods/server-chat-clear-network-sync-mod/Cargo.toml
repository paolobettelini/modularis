[package]
name = "server-chat-clear-network-sync-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerChatClearNetworkSyncMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-chat-api", "server-network-events-api"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
chat-clear-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
server-chat-api = { path = "../server-chat-api" }
server-network-events-api = { path = "../server-network-events-api" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
