[package]
name = "client-player-controller-fps-bevy-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "FpsPlayerControllerBevyImpl"
provides = "client-player-controller-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-player-physics-tick-api",
    "client-input-api",
    "client-camera-api",
    "collision-api",
    "player-hitbox-api",
    "player-gravity-api",
    "player-speed-api",
    "client-game-state-api",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-camera-api = { git = "https://github.com/paolobettelini/modularis.git" }
collision-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-input-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-physics-tick-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-player-controller-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-gravity-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-hitbox-api = { git = "https://github.com/paolobettelini/modularis.git" }
player-speed-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
