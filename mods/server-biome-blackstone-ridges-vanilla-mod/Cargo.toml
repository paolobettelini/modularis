[package]
name = "server-biome-blackstone-ridges-vanilla-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerBiomeBlackstoneRidgesVanillaMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-biome-api", "biome-blackstone-ridges", "server-biome-feature-caves-vanilla-mod", "server-biome-feature-nether-ores-vanilla-mod", "server-biome-feature-nether-formations-vanilla-mod"]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
biome-blackstone-ridges = { path = "../biome-blackstone-ridges" }
generated-biome-registry = "0.1.0"
generated-block-registry = "0.1.0"
server-biome-api = { path = "../server-biome-api" }
server-biome-feature-caves-vanilla-mod = { path = "../server-biome-feature-caves-vanilla-mod" }
server-biome-feature-nether-ores-vanilla-mod = { path = "../server-biome-feature-nether-ores-vanilla-mod" }
server-biome-feature-nether-formations-vanilla-mod = { path = "../server-biome-feature-nether-formations-vanilla-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
