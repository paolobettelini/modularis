[package]
name = "block-durability-bedrock-vanilla-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "BlockDurabilityBedrockVanillaMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "block-properties-registry-mod", "block-bedrock"]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
block-bedrock = { path = "../block-bedrock" }
block-durability-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-properties-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-properties-registry-mod = { path = "../block-properties-registry-mod" }
generated-block-registry = "0.1.0"
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
generated-block-state = { path = "../generated-block-state" }
