[package]
name = "client-setting-grass-dynamic-wind-strength"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingGrassDynamicWindStrengthMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "grass.dynamic_wind_strength"
label = "Dynamic wind strength"
type = "f32"
input = "f32"
default = 0.8
min = 0.0
max = 1.0
section = "graphics/grass"
section_label = "Grass"

[dependencies]
settings-schema-api = { path = "../settings-schema-api" }
tokio = { version = "1.48.0", features = ["full"] }
