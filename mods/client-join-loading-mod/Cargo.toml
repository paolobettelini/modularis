[package]
name = "client-join-loading-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ClientJoinLoadingMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-loading-api",
    "client-game-state-api",
    "client-chunk-cache-api",
    "network-transport-events-mod",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
client-chunk-cache-api = { path = "../client-chunk-cache-api" }
client-game-state-api = { path = "../client-game-state-api" }
client-loading-api = { path = "../client-loading-api" }
generated-network-messages = "0.1.0"
loading-task-api = { git = "https://github.com/paolobettelini/modularis.git" }
network-protocol-mod = { path = "../network-protocol-mod" }
network-transport-events-mod = { path = "../network-transport-events-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
