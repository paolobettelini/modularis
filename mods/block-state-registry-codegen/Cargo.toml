[package]
name = "block-state-registry-codegen"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "BlockStateRegistryCodegenMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[[package.metadata.mod.codegen]]
crate = "generated-block-state"
version = "0.1.0"
dev_crate = "generated-block-state"

[package.metadata.mod.codegen.generator]
crate = "block-state-registry-codegen"
command = "generate"

[dependencies]
codegen-utils = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9"
