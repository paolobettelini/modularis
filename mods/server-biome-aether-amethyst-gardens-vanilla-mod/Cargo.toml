[package]
name = "server-biome-aether-amethyst-gardens-vanilla-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerBiomeAetherAmethystGardensVanillaMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-biome-api", "biome-aether-amethyst-gardens", "server-biome-feature-crystal-spires-vanilla-mod", "server-biome-feature-aether-lights-vanilla-mod", "server-biome-feature-cherry-trees-vanilla-mod"]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
biome-aether-amethyst-gardens = { path = "../biome-aether-amethyst-gardens" }
generated-biome-registry = "0.1.0"
generated-block-registry = "0.1.0"
server-biome-api = { path = "../server-biome-api" }
server-biome-feature-crystal-spires-vanilla-mod = { path = "../server-biome-feature-crystal-spires-vanilla-mod" }
server-biome-feature-aether-lights-vanilla-mod = { path = "../server-biome-feature-aether-lights-vanilla-mod" }
server-biome-feature-cherry-trees-vanilla-mod = { path = "../server-biome-feature-cherry-trees-vanilla-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
