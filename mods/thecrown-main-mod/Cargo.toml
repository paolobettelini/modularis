[package]
name = "thecrown-main-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "TheCrownMainMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-scope-api",
    "server-scope-world-api",
    "server-chunk-world-api",
    "server-player-registry-api",
    "server-player-world-api",
    "server-player-lifecycle-events-mod",
    "server-chat-api",
    "block-edit-events-mod",
]
run = []
ownership = []

[dependencies]
audience-api = { path = "../audience-api" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-edit-events-api = { path = "../block-edit-events-api" }
block-edit-events-mod = { path = "../block-edit-events-mod" }
block-instance-api = { path = "../block-instance-api" }
generated-block-registry = "0.1.0"
parkour-gameplay-lib = { path = "../parkour-gameplay-lib" }
player-network-message-types = { path = "../player-network-message-types" }
server-chat-api = { path = "../server-chat-api" }
server-chunk-provider-api = { path = "../server-chunk-provider-api" }
server-chunk-routing-api = { path = "../server-chunk-routing-api" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-player-chat-lib = { path = "../server-player-chat-lib" }
server-player-lifecycle-events-api = { path = "../server-player-lifecycle-events-api" }
server-player-lifecycle-events-mod = { path = "../server-player-lifecycle-events-mod" }
server-player-registry-api = { path = "../server-player-registry-api" }
server-player-world-api = { path = "../server-player-world-api" }
server-scope-api = { path = "../server-scope-api" }
server-scope-world-api = { path = "../server-scope-world-api" }
tokio = { version = "1.48.0", features = ["full"] }
world-instance-api = { path = "../world-instance-api" }

[patch.crates-io]
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
