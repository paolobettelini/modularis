[package]
name = "thecrown-main-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "TheCrownMainMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-scope-api",
    "server-scope-world-api",
    "server-chunk-world-api",
    "server-player-registry-api",
    "server-player-world-api",
    "server-player-lifecycle-events-mod",
    "server-chat-api",
    "server-sound-api",
    "block-edit-events-mod",
]
run = []
ownership = []

[dependencies]
actix-web = "4.13.0"
audience-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-block-registry = "0.1.0"
generated-sound-registry = "0.1.0"
leptos = { version = "0.8.20", default-features = false, features = ["ssr"] }
parkour-gameplay-lib = { git = "https://github.com/paolobettelini/modularis.git" }
player-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
server-chat-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-provider-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-routing-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-world-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-chat-lib = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-registry-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-world-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-scope-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-scope-world-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-sound-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-sound-registry = { path = "../generated-sound-registry" }
