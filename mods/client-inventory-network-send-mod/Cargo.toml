[package]
name = "client-inventory-network-send-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientInventoryNetworkSendMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "inventory-events-mod",
    "client-network-api",
    "client-game-state-api",
    "client-inventory-cache-api",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
client-network-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-inventory-cache-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
inventory-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
inventory-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
inventory-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
network-protocol-mod = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
