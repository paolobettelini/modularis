[package]
name = "server-voxel-frame-network-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ServerVoxelFrameNetworkMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod","server-chunk-world-api","server-player-registry-api","server-chunk-residency-api","server-network-events-api","network-protocol-mod"]
run = []
ownership = []

[dependencies]
voxel-frame-kinematic-api = {path = "../voxel-frame-kinematic-api"}
voxel-frame-movement-lib = {git = "https://github.com/paolobettelini/modularis.git"}
server-voxel-frame-motion-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
server-chunk-world-api = { path = "../server-chunk-world-api" }
server-player-registry-api = { path = "../server-player-registry-api" }
server-chunk-residency-api = { path = "../server-chunk-residency-api" }
server-network-events-api = { path = "../server-network-events-api" }
network-protocol-mod = { path = "../network-protocol-mod" }
voxel-frame-api = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-frame-registry-api = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-frame-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
tokio = { version = "1.48.0", features = ["full"] }
