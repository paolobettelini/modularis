[package]
name = "server-world-catalog-build-server-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerWorldCatalogBuildServerImpl"
provides = "server-world-catalog-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "dimension-overworld",
    "dimension-nether",
    "dimension-aether",
]
run = []
ownership = []

[dependencies]
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
dimension-aether = { git = "https://github.com/paolobettelini/modularis.git" }
dimension-nether = { git = "https://github.com/paolobettelini/modularis.git" }
dimension-overworld = { git = "https://github.com/paolobettelini/modularis.git" }
generated-dimension-registry = "0.1.0"
server-world-catalog-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-dimension-registry = { path = "../generated-dimension-registry" }
