[package]
name = "block-shape-voxel-model-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "BlockShapeVoxelModelImpl"
provides = "block-shape-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "block-manager-api", "voxel-model-api"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-shape-api = { git = "https://github.com/paolobettelini/modularis.git" }
collision-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-model-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
