[package]
name = "client-setting-fov"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingFovMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "graphics.fov"
label = "Field of view (degrees)"
type = "f32"
input = "f32"
default = 75.0
min = 30.0
max = 120.0
section = "graphics"
section_label = "Graphics"

[dependencies]
settings-schema-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
