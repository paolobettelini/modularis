[package]
name = "client-setting-grass-wind-direction"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientSettingGrassWindDirectionMod"

[package.metadata.mod.dependencies]
init = []
run = []
ownership = []

[package.metadata.setting]
id = "grass.wind_direction_degrees"
label = "Wind direction (degrees)"
type = "f32"
input = "f32"
default = 0.0
min = 0.0
max = 360.0
section = "graphics/grass"
section_label = "Grass"

[dependencies]
settings-schema-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
