[package]
name = "server-biome-savanna-vanilla-mod"
version = "0.1.2"
edition = "2024"

[package.metadata.mod]
entry = "ServerBiomeSavannaVanillaMod"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "server-biome-api", "biome-savanna", "server-biome-feature-caves-vanilla-mod", "server-biome-feature-ores-vanilla-mod", "server-biome-feature-acacia-trees-vanilla-mod", "server-biome-feature-short-grass-vanilla-mod", "server-biome-feature-surface-patches-vanilla-mod"]
run = []
ownership = []

[dependencies]
bevy-mod = { path = "../bevy-mod" }
biome-savanna = { path = "../biome-savanna" }
generated-biome-registry = "0.1.0"
generated-block-registry = "0.1.0"
server-biome-api = { path = "../server-biome-api" }
server-biome-feature-caves-vanilla-mod = { path = "../server-biome-feature-caves-vanilla-mod" }
server-biome-feature-ores-vanilla-mod = { path = "../server-biome-feature-ores-vanilla-mod" }
server-biome-feature-acacia-trees-vanilla-mod = { path = "../server-biome-feature-acacia-trees-vanilla-mod" }
server-biome-feature-short-grass-vanilla-mod = { path = "../server-biome-feature-short-grass-vanilla-mod" }
server-biome-feature-surface-patches-vanilla-mod = { path = "../server-biome-feature-surface-patches-vanilla-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-state = { path = "../generated-block-state" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
