[package]
name = "network-protocol-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "NetworkProtocolMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-registry-codegen",
    "item-registry-codegen",
    "item-metadata-registry-codegen",
]
run = []
ownership = []

[[package.metadata.mod.codegen]]
crate = "generated-network-messages"
version = "0.1.0"
dev_crate = "generated-network-messages"

[package.metadata.mod.codegen.generator]
crate = "network-codegen-utils"
command = "generate"

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-registry-codegen = { path = "../block-registry-codegen" }
generated-network-messages = "0.1.0"
item-metadata-registry-codegen = { path = "../item-metadata-registry-codegen" }
item-registry-codegen = { path = "../item-registry-codegen" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
