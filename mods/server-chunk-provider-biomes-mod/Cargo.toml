[package]
name = "server-chunk-provider-biomes-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerChunkProviderBiomesMod"
provides = "server-primary-chunk-provider-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-chunk-provider-registry-mod",
    "block-manager-api",
    "server-biome-api",
    "server-biome-selection-api",
    "server-world-seed-api",
]
run = []
ownership = []

[dependencies]
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
chunk-api = { git = "https://github.com/paolobettelini/modularis.git" }
coherent-noise-api = { git = "https://github.com/paolobettelini/modularis.git" }
generated-biome-registry = "0.1.0"
generated-block-registry = "0.1.0"
server-biome-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-biome-sampling-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-biome-selection-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-provider-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-chunk-provider-registry-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-primary-chunk-provider-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-world-seed-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
world-instance-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-biome-registry = { path = "../generated-biome-registry" }
generated-block-metadata = { path = "../generated-block-metadata" }
generated-block-registry = { path = "../generated-block-registry" }
generated-dimension-registry = { path = "../generated-dimension-registry" }
