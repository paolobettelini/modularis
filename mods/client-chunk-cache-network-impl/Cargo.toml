[package]
name = "client-chunk-cache-network-impl"
version = "0.1.2"
edition = "2024"

[package.metadata.mod]
entry = "ClientNetworkChunkCache"
provides = "client-chunk-cache-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "network-protocol-mod",
    "block-edit-events-mod",
    "client-chunk-streaming-api",
    "client-game-state-api",
    "client-session-api",
]
run = []
ownership = []

[dependencies]
client-voxel-frame-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-dimension-api = { path = "../client-dimension-api" }
client-world-context-api = { path = "../client-world-context-api" }
client-session-api = { path = "../client-session-api" }
voxel-frame-api = { git = "https://github.com/paolobettelini/modularis.git" }
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
block-edit-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-edit-events-mod = { path = "../block-edit-events-mod" }
client-chunk-cache-api = { path = "../client-chunk-cache-api" }
client-chunk-streaming-api = { path = "../client-chunk-streaming-api" }
client-game-state-api = { path = "../client-game-state-api" }
generated-network-messages = "0.1.0"
generated-block-registry = "0.1.0"
network-protocol-mod = { path = "../network-protocol-mod" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
generated-block-registry = { path = "../generated-block-registry" }
