[package]
name = "client-loading-network-receive-mod"
version = "0.1.1"
edition = "2024"

[package.metadata.mod]
entry = "ClientLoadingNetworkReceiveMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-loading-api",
    "loading-screen-network-messages-mod",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
