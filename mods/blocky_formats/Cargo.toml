[package]
name = "blocky_formats"
version = "0.1.3"
edition = "2021"
description = "Parser and lightweight runtime helpers for Hytale Blockbench .blockymodel and .blockyanim files."
license = "MIT"
readme = "README.md"
keywords = ["blockbench", "hytale", "bevy", "voxel", "animation"]
categories = ["game-development", "parser-implementations"]

[features]
default = []
glam = ["dep:glam"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
glam = { version = "0.32", optional = true }

