[package]
name = "server-sun-network-sync-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ServerSunNetworkSyncMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "server-sun-api",
    "server-network-events-api",
    "server-player-lifecycle-events-mod",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
generated-network-messages = "0.1.0"
network-protocol-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-network-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-lifecycle-events-mod = { git = "https://github.com/paolobettelini/modularis.git" }
server-player-registry-api = { git = "https://github.com/paolobettelini/modularis.git" }
server-sun-api = { git = "https://github.com/paolobettelini/modularis.git" }
sun-api = { git = "https://github.com/paolobettelini/modularis.git" }
sun-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-network-messages = { path = "../generated-network-messages" }
