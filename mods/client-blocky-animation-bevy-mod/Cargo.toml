[package]
name = "client-blocky-animation-bevy-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientBlockyAnimationBevyMod"
provides = "blocky-animation-api"

[package.metadata.mod.dependencies]
init = ["bevy-mod", "blocky-model-api", "client-game-state-api"]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
blocky-animation-api = { git = "https://github.com/paolobettelini/modularis.git" }
blocky-model-api = { git = "https://github.com/paolobettelini/modularis.git" }
blocky_formats = { git = "https://github.com/paolobettelini/modularis.git" }
client-game-state-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
