[package]
name = "client-chunk-mesh-voxel-models-impl"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "VoxelModelChunkMesher"
provides = "client-chunk-mesh-api"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "block-manager-api",
    "client-chunk-vertex-lighting-api",
    "voxel-model-api",
]
run = []
ownership = []

[dependencies]
bevy-mod = { git = "https://github.com/paolobettelini/modularis.git" }
block-manager-api = { git = "https://github.com/paolobettelini/modularis.git" }
block-render-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-mesh-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-chunk-vertex-lighting-api = { git = "https://github.com/paolobettelini/modularis.git" }
tokio = { version = "1.48.0", features = ["full"] }
voxel-math-api = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-model-api = { git = "https://github.com/paolobettelini/modularis.git" }
voxel-models-lib = { git = "https://github.com/paolobettelini/modularis.git" }
