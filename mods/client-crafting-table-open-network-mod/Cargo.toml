[package]
name = "client-crafting-table-open-network-mod"
version = "0.1.0"
edition = "2024"

[package.metadata.mod]
entry = "ClientCraftingTableOpenNetworkMod"

[package.metadata.mod.dependencies]
init = [
    "bevy-mod",
    "client-block-interaction-events-mod",
    "client-chunk-cache-api",
    "client-network-api",
    "network-protocol-mod",
]
run = []
ownership = []

[dependencies]
bevy = "0.17.3"
bevy-mod = { path = "../bevy-mod" }
cell-menu-network-message-types = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-interaction-events-api = { git = "https://github.com/paolobettelini/modularis.git" }
client-block-interaction-events-mod = { path = "../client-block-interaction-events-mod" }
client-chunk-cache-api = { path = "../client-chunk-cache-api" }
client-network-api = { path = "../client-network-api" }
generated-block-registry = "0.1.0"
generated-network-messages = "0.1.0"
item-use-api = { git = "https://github.com/paolobettelini/modularis.git" }
network-protocol-mod = { path = "../network-protocol-mod" }
tokio = { version = "1.48.0", features = ["full"] }

[patch.crates-io]
generated-block-registry = { path = "../generated-block-registry" }
generated-network-messages = { path = "../generated-network-messages" }
