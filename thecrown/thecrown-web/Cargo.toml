[package]
name = "thecrown-web"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["sqlite"]
sqlite = ["dep:thecrown-database", "thecrown-database/sqlite"]
mysql = ["dep:thecrown-database", "thecrown-database/mysql"]
hydrate = [
    "dep:console_error_panic_hook",
    "dep:wasm-bindgen",
    "leptos/hydrate",
]
server = [
    "dep:actix-files",
    "dep:actix-web",
    "dep:anyhow",
    "dep:clap",
    "dep:env_logger",
    "dep:futures-util",
    "dep:leptos_actix",
    "dep:log",
    "dep:mime_guess",
    "dep:rust-embed",
    "dep:thecrown-common",
    "dep:tokio",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
]

[dependencies]
actix-files = { version = "0.6", optional = true }
actix-web = { version = "4.14.0", optional = true }
anyhow = { version = "1.0", optional = true }
clap = { version = "4.6.6", features = ["derive"], optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
env_logger = { version = "0.11", optional = true }
futures-util = { version = "0.3", optional = true }
leptos = "0.8.20"
leptos_actix = { version = "0.8.7", optional = true }
leptos_meta = "0.8.6"
leptos_router = "0.8.15"
log = { version = "0.4", optional = true }
mime_guess = { version = "2.0", optional = true }
rust-embed = { version = "8.12.0", features = ["include-exclude", "interpolate-folder-path"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thecrown-common = { path = "../../mods/thecrown-common", optional = true }
thecrown-database = { path = "../../mods/thecrown-database", default-features = false, optional = true }
thecrown-protocol = { path = "../../mods/thecrown-protocol" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"], optional = true }
uuid = { version = "1.24.0", features = ["serde"] }
wasm-bindgen = { version = "0.2.106", optional = true }

[package.metadata.leptos]
output-name = "thecrown"
site-root = "dist"
site-pkg-dir = "pkg"
style-file = "style/main.css"
assets-dir = "assets"
site-addr = "127.0.0.1:8080"
reload-port = 8081
browserquery = "defaults"
hash-files = false
env = "DEV"
bin-features = ["server"]
bin-default-features = true
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
