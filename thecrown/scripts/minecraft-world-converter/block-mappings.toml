[rules]
# Thin geometry is generally less damaging when omitted than when replaced by a cube.
"suffix:_sapling" = "demo:short_grass"
"suffix:_grass" = "demo:short_grass"
"suffix:_bush" = "demo:short_grass"
"contains:eyeblossom" = "demo:short_grass"
"contains:anvil" = "demo:anvil"
"prefix:potted_" = "demo:air"
"suffix:_torch" = "demo:air"
"suffix:_wall_torch" = "demo:air"
"suffix:_candle" = "demo:air"
"contains:rail" = "demo:air"
"contains:tripwire" = "demo:air"

# Flowers and small plants use the one available plant-like voxel.
"contains:tulip" = "demo:short_grass"
"contains:flower" = "demo:short_grass"
"contains:orchid" = "demo:short_grass"
"contains:allium" = "demo:short_grass"
"contains:bluet" = "demo:short_grass"
"contains:dandelion" = "demo:short_grass"
"contains:poppy" = "demo:short_grass"
"contains:daisy" = "demo:short_grass"
"contains:cornflower" = "demo:short_grass"
"contains:lily_of_the_valley" = "demo:short_grass"
"contains:wither_rose" = "demo:short_grass"
"contains:sunflower" = "demo:short_grass"
"contains:lilac" = "demo:short_grass"
"contains:rose_bush" = "demo:short_grass"
"contains:peony" = "demo:short_grass"

# Heads/skulls are closer to bone/stone than arbitrary stone fallback.
"contains:skull" = "demo:bone-block"
"contains:head" = "demo:bone-block"
