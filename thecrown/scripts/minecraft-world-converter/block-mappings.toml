# Minecraft -> Modularis block mapping policy.
#
# Resolution order:
#   1. [exact]
#   2. same-name Modularis block (minecraft:foo_bar -> demo:foo-bar)
#   3. shape/material reduction using [materials]
#   4. [rules]
#   5. semantic nearest-block matching
#   6. fallback
#
# The parser intentionally supports only this small TOML subset so the converter
# does not need another runtime dependency.

[settings]
fallback = "demo:stone"
fuzzy = true
minimum_fuzzy_score = 7
shape_suffixes = "_wall_hanging_sign,_hanging_sign,_wall_sign,_fence_gate,_pressure_plate,_trapdoor,_stairs,_slab,_wall,_fence,_button,_door,_carpet,_bed,_wall_banner,_banner,_shulker_box,_bulb,_pane,_sign"

