description = "Multiplayer minecraft-style server using Bevy."
ignore = []
modpacks = [
    "server-base",
    "server-vanilla",
    "server-patchwork-auth",
]
mods = [
    "server-world-catalog-build-server-impl",
    "server-world-seed-catalog-fs-impl",
    "server-chunk-provider-registry-mod",
    "server-chunk-storage-fs-impl",
    "server-chunk-storage-periodic-flush-mod",
    "server-chunk-storage-shutdown-flush-mod",
    "server-dimension-registry-mod",
    "server-dimension-overworld-mod",
    "server-chunk-routing-dimensions-mod",
    "server-chunk-provider-nether-mod",
    "server-dimension-nether-mod",
    "server-chunk-provider-aether-mod",
    "server-dimension-aether-mod",
    "server-chunk-world-dynamic-impl",
]
name = "Minecraft demo server"
version = "0.0.1"

[options.build]
args = ["--config /home/paolo/Desktop/videogames/minecraft_simple_demo/mods/.cargo/config.toml"]

[options.build.env]
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
GIT_SSH_COMMAND = "ssh -i ~/.ssh/id_ed25519_github -o IdentitiesOnly=yes"
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "url.git@github.com:.insteadOf"
GIT_CONFIG_VALUE_0 = "https://github.com/"