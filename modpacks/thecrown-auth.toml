name = "TheCrown Auth"
version = "0.1.2"
description = "Patchwork-authenticated TheCrown entry server. It only asks Relay for a destination and transfers the client."
color = "#b56cff"
modpacks = ["server-core", "server-patchwork-auth"]
ignore = ["server-config-local-impl"]

mods = [
    "server-config-thecrown-auth-impl",
    "server-player-visibility-all-impl",
    "thecrown-auth-relay-nats-mod",
    "thecrown-auth-main-mod",
]

[options.build]
args = [
    "--jobs 12",
    "--config /home/paolo/Desktop/videogames/minecraft_simple_demo/mods/.cargo/config.toml",
]

[options.build.env]
CARGO_NET_GIT_FETCH_WITH_CLI = "true"
GIT_CONFIG_COUNT = "1"
GIT_CONFIG_KEY_0 = "url.git@github.com:.insteadOf"
GIT_CONFIG_VALUE_0 = "https://github.com/"
GIT_SSH_COMMAND = "ssh -i ~/.ssh/id_ed25519_github -o IdentitiesOnly=yes"

